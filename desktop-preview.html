<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RWA.ms Responsive Preview</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#fff}
body{overflow-x:hidden}
#desktopWrap{display:block;width:100%;overflow:hidden;background:#fff}
#desktopStage{width:1672px;height:941px;transform-origin:top left;background:#fff}
#desktopFrame{display:block;border:0;width:1672px;height:941px;background:#fff}
#mobileWrap{display:none;width:100%;height:100dvh;overflow:hidden;background:#fff}
#mobileFrame{display:block;border:0;width:100%;height:100dvh;background:#fff}
@media (max-width:1023px){
  #desktopWrap{display:none!important}
  #mobileWrap{display:block!important}
  body{height:100dvh;overflow:hidden}
}
@media (min-width:1024px){
  #desktopWrap{display:block!important}
  #mobileWrap{display:none!important}
}
body[data-force="mobile"] #desktopWrap{display:none!important}
body[data-force="mobile"] #mobileWrap{display:block!important}
body[data-force="desktop"] #desktopWrap{display:block!important}
body[data-force="desktop"] #mobileWrap{display:none!important}
</style>
</head>
<body>
<div id="desktopWrap"><div id="desktopStage"><iframe id="desktopFrame" src="desktop.html?precision=1" title="RWA.ms desktop real-code preview"></iframe></div></div>
<div id="mobileWrap"><iframe id="mobileFrame" src="mobile-code.html?responsive=1" title="RWA.ms mobile real-code preview"></iframe></div>
<script>
const desktopFrame=document.getElementById('desktopFrame');
const mobileFrame=document.getElementById('mobileFrame');
const desktopStage=document.getElementById('desktopStage');
const desktopWrap=document.getElementById('desktopWrap');
const qs=new URLSearchParams(location.search);
const forced=qs.get('view');
if(forced==='mobile'||forced==='desktop')document.body.dataset.force=forced;
const desktopCss=['desktop-finetune.css?v=091907a','desktop-pass.css?v=091907a','desktop-final.css?v=092105a'];
const mobileCss=['mobile-responsive.css?v=092224a'];
function inject(frame,files){
  const doc=frame.contentDocument;
  if(!doc)return;
  for(const href of files){
    if(doc.querySelector(`link[data-preview-css="${href}"]`))continue;
    const link=doc.createElement('link');
    link.rel='stylesheet';link.href=href;link.dataset.previewCss=href;doc.head.appendChild(link);
  }
}
desktopFrame.addEventListener('load',()=>inject(desktopFrame,desktopCss));
mobileFrame.addEventListener('load',()=>inject(mobileFrame,mobileCss));
function viewportWidth(){return Math.round(window.visualViewport?.width||document.documentElement.clientWidth||window.innerWidth||0)}
function isMobileViewport(){
  if(forced==='mobile')return true;
  if(forced==='desktop')return false;
  const uaMobile=/Android|iPhone|iPod|Mobile|IEMobile|Opera Mini/i.test(navigator.userAgent)||navigator.userAgentData?.mobile===true;
  return viewportWidth()<=1023||(uaMobile&&viewportWidth()<1366);
}
function fitDesktop(){
  if(isMobileViewport())return;
  const vw=viewportWidth();
  const scale=Math.min(1,vw/1672);
  desktopStage.style.transform=`scale(${scale})`;
  desktopStage.style.marginLeft=vw>1672?`${(vw-1672)/2}px`:'0px';
  desktopWrap.style.height=`${Math.ceil(941*scale)}px`;
}
function syncMode(){
  const mobile=isMobileViewport();
  document.documentElement.dataset.mode=mobile?'mobile':'desktop';
  if(!mobile)fitDesktop();
}
const mq=window.matchMedia('(max-width:1023px)');
if(mq.addEventListener)mq.addEventListener('change',syncMode);else mq.addListener(syncMode);
window.addEventListener('resize',syncMode,{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(syncMode,50),{passive:true});
window.visualViewport?.addEventListener('resize',syncMode,{passive:true});
syncMode();
</script>
</body>
</html>
