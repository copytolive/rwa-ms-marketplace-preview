<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>RWA.ms Responsive Preview</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#fff}
body{overflow-x:hidden}
#desktopWrap{display:block;position:relative;width:100vw;overflow:hidden;background:#fff}
#desktopStage{position:absolute;left:0;top:0;width:1672px;height:941px;margin:0!important;transform-origin:top left;background:#fff}
#desktopFrame{display:block;border:0;width:1672px;height:941px;background:#fff}
#mobileWrap{display:none;width:100%;height:100dvh;overflow:hidden;background:#fff}
#mobileFrame{display:block;border:0;width:100%;height:100dvh;background:#fff}
@media (max-width:1199px){#desktopWrap{display:none!important}#mobileWrap{display:block!important}body{height:100dvh;overflow:hidden}}
@media (min-width:1200px){#desktopWrap{display:block!important}#mobileWrap{display:none!important}}
body[data-force="mobile"] #desktopWrap{display:none!important}
body[data-force="mobile"] #mobileWrap{display:block!important}
body[data-force="desktop"] #desktopWrap{display:block!important}
body[data-force="desktop"] #mobileWrap{display:none!important}
</style>
</head>
<body>
<div id="desktopWrap"><div id="desktopStage"><iframe id="desktopFrame" data-src="desktop.html?precision=20&drawer=20260909v" title="RWA.ms desktop real-code preview"></iframe></div></div>
<div id="mobileWrap"><iframe id="mobileFrame" data-src="mobile-code.html?responsive=2&build=20260909v" title="RWA.ms mobile real-code preview"></iframe></div>
<script>
const BUILD='20260909v';
try{const u=new URL(location.href);if(u.searchParams.get('build')!==BUILD){u.searchParams.set('build',BUILD);location.replace(u.toString())}}catch(_e){}
const desktopFrame=document.getElementById('desktopFrame');
const mobileFrame=document.getElementById('mobileFrame');
const desktopStage=document.getElementById('desktopStage');
const desktopWrap=document.getElementById('desktopWrap');
const qs=new URLSearchParams(location.search);
const forced=qs.get('view');
if(forced==='mobile'||forced==='desktop')document.body.dataset.force=forced;
const desktopCss=['desktop-finetune.css?v=092209v','desktop-pass.css?v=092209v','desktop-final.css?v=092209v'];
function inject(frame,files){const doc=frame.contentDocument;if(!doc)return;for(const href of files){if(doc.querySelector(`link[data-preview-css="${href}"]`))continue;const link=doc.createElement('link');link.rel='stylesheet';link.href=href;link.dataset.previewCss=href;doc.head.appendChild(link)}}
function installDesktopDrawer(doc){
  if(!doc||doc.documentElement.dataset.rwaDrawer==='1')return;
  const sidebar=doc.querySelector('.sidebar');
  const topbar=doc.querySelector('.topbar');
  const brand=doc.querySelector('.topbar .brand');
  if(!sidebar||!topbar||!brand)return;
  doc.documentElement.dataset.rwaDrawer='1';

  const overlay=doc.createElement('button');
  overlay.type='button';
  overlay.className='rwa-drawer-overlay';
  overlay.setAttribute('aria-label','Close navigation');
  doc.body.appendChild(overlay);

  // Move the drawer to <body> so its z-index is not trapped by the original shell stacking context.
  // This keeps the Amazon-style panel fully above the dimming overlay.
  doc.body.appendChild(sidebar);

  const menu=doc.createElement('button');
  menu.type='button';
  menu.className='rwa-menu-toggle';
  menu.setAttribute('aria-label','Open navigation');
  menu.setAttribute('aria-expanded','false');
  menu.innerHTML='<i class="fa-solid fa-bars" aria-hidden="true"></i><span>Menu</span>';
  topbar.insertBefore(menu,brand);

  const head=doc.createElement('div');
  head.className='rwa-drawer-head';
  const logoSrc=brand.querySelector('img')?.getAttribute('src')||'assets/logo-ref-exact.png';
  head.innerHTML=`<div class="rwa-drawer-brand"><img src="${logoSrc}" alt="RWA.ms"><small>Browse all categories</small></div>`;
  sidebar.insertBefore(head,sidebar.firstChild);

  const closeBtn=doc.createElement('button');
  closeBtn.type='button';
  closeBtn.className='rwa-drawer-close';
  closeBtn.setAttribute('aria-label','Close navigation');
  closeBtn.innerHTML='<i class="fa-solid fa-xmark" aria-hidden="true"></i>';
  doc.body.appendChild(closeBtn);

  const promo=sidebar.querySelector(':scope > .side-promo');
  const learn=sidebar.querySelector('[data-action="open-learn-and-discover"]');
  if(promo&&learn&&learn.nextElementSibling!==promo)learn.after(promo);

  const style=doc.createElement('style');
  style.dataset.rwaDrawer='1';
  style.textContent=`
    html,body{overflow-x:hidden!important}
    .content{left:18px!important;width:1636px!important}
    .hero-row{grid-template-columns:951px minmax(0,1fr)!important}
    .hero-visual{left:484px!important;right:auto!important;width:314px!important}
    .hero-visual img{width:314px!important;height:282px!important;object-fit:fill!important}
    .topchart .chart{width:calc(100% - 42px)!important}
    .verticals{height:181px!important;grid-template-columns:repeat(6,minmax(0,1fr))!important;gap:10px!important}
    .product-vertical{height:181px!important;background:#f8fbfa!important}
    .product-vertical:after{background:linear-gradient(145deg,rgba(255,255,255,.94) 0%,rgba(255,255,255,.66) 57%,rgba(0,116,84,.05) 100%)!important}
    .product-vertical>img{display:none!important}
    .product-vertical .v-copy{left:15px!important;top:14px!important;width:calc(100% - 30px)!important}
    .product-vertical .v-copy h3{font-size:22px!important;transform:none!important}
    .product-vertical .v-copy p{font-size:11px!important}
    .asset-grid{width:auto!important;margin-left:9px!important;margin-right:9px!important;grid-template-columns:repeat(6,minmax(0,1fr))!important}
    .trustbar{width:100%!important}
    .topbar{padding-left:18px!important;z-index:20!important}
    .topbar>.brand{width:160px!important;flex:0 0 160px!important}
    .topbar>.brand img{width:145px!important}
    .rwa-menu-toggle{position:relative!important;z-index:2!important;height:42px!important;min-width:82px!important;padding:0 12px!important;border:1px solid #dce3e8!important;border-radius:9px!important;background:#fff!important;color:#071733!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:8px!important;font-size:12px!important;font-weight:700!important;cursor:pointer!important;flex:0 0 auto!important}
    .rwa-menu-toggle i{font-size:17px!important}
    .rwa-drawer-overlay{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;border:0!important;background:rgba(0,0,0,.62)!important;opacity:0!important;pointer-events:none!important;z-index:9998!important;transition:opacity .22s ease!important;cursor:pointer!important}
    .rwa-drawer-overlay[data-open="true"]{opacity:1!important;pointer-events:auto!important}
    .sidebar{position:fixed!important;left:0!important;top:0!important;bottom:0!important;width:326px!important;height:100vh!important;min-height:100vh!important;max-height:100vh!important;margin:0!important;padding:0 12px 18px!important;display:flex!important;flex-direction:column!important;gap:7px!important;background:#fff!important;border:0!important;border-right:1px solid #d9e1e5!important;border-radius:0!important;box-shadow:8px 0 28px rgba(0,0,0,.22)!important;overflow-y:auto!important;overscroll-behavior:contain!important;scrollbar-width:thin!important;scrollbar-color:#b6c0c5 transparent!important;z-index:10000!important;isolation:isolate!important;transform:translateX(-102%)!important;transition:transform .24s cubic-bezier(.2,.8,.2,1)!important}
    .sidebar::-webkit-scrollbar{width:8px!important}.sidebar::-webkit-scrollbar-track{background:transparent!important}.sidebar::-webkit-scrollbar-thumb{background:#b6c0c5!important;border-radius:10px!important}
    .sidebar[data-drawer-open="true"]{transform:translateX(0)!important}
    .rwa-drawer-head{position:sticky!important;top:0!important;z-index:3!important;min-height:82px!important;margin:0 -12px 5px!important;padding:12px 16px!important;background:#fff!important;border-bottom:1px solid #dfe5e8!important;display:flex!important;align-items:center!important;justify-content:flex-start!important;gap:12px!important;flex:0 0 auto!important}
    .rwa-drawer-brand{display:flex!important;align-items:flex-start!important;flex-direction:column!important;gap:2px!important}
    .rwa-drawer-brand img{display:block!important;width:154px!important;height:auto!important}
    .rwa-drawer-brand small{font-size:10px!important;color:#607187!important;margin-left:2px!important}
    .rwa-drawer-close{position:fixed!important;left:338px!important;top:14px!important;width:42px!important;height:42px!important;border:0!important;border-radius:4px!important;background:transparent!important;color:#fff!important;display:grid!important;place-items:center!important;cursor:pointer!important;z-index:10001!important;opacity:0!important;pointer-events:none!important;transform:scale(.92)!important;transition:opacity .18s ease,transform .18s ease!important} .rwa-drawer-close[data-open="true"]{opacity:1!important;pointer-events:auto!important;transform:scale(1)!important} .rwa-drawer-close:hover{background:rgba(255,255,255,.12)!important}
    .rwa-drawer-close i{font-size:18px!important}
    .sidebar>.side-group,.sidebar>.side-simple,.sidebar>.side-promo{flex-shrink:0!important}
    .sidebar>.side-group[data-accordion-group]{height:auto!important;min-height:46px!important;border-radius:10px!important;background:#fff!important;border:1px solid #e6eeeb!important;overflow:hidden!important}
    .sidebar>.side-group[data-accordion-group] .side-title{height:46px!important;min-height:46px!important;padding:0 14px!important;border-left:4px solid #078161!important;border-radius:0!important;background:#eaf6f1!important;font-size:14px!important}
    .sidebar>.side-group[data-accordion-group][data-expanded="true"]>.side-title{background:#dff1ea!important}
    .sidebar>.side-group[data-accordion-group][data-expanded="false"]>a{display:none!important}
    .sidebar>.side-group[data-accordion-group][data-expanded="true"]>a{display:flex!important}
    .sidebar>.side-group[data-accordion-group]>a{height:36px!important;min-height:36px!important;padding:0 15px!important;gap:12px!important;font-size:13px!important;background:#fff!important;border-top:1px solid #f0f4f3!important}
    .sidebar>.side-simple{height:40px!important;min-height:40px!important;display:grid!important;grid-template-columns:22px 1fr 14px!important;align-items:center!important;gap:10px!important;padding:0 14px!important;border-radius:9px!important;background:#fff!important;border:1px solid transparent!important;font-size:13px!important}
    .sidebar>.side-simple:hover{border-color:#e4ece9!important;background:#f3f8f6!important}
    .sidebar>.side-promo{position:relative!important;margin:4px 0 0!important;width:100%!important;height:86px!important;min-height:86px!important;flex:0 0 86px!important;border-radius:12px!important;padding:12px 12px 12px 94px!important;overflow:hidden!important;background:linear-gradient(135deg,#4d8462,#d8ecdf)!important}
    .sidebar>.side-promo .promo-art{position:absolute!important;left:0!important;top:0!important;width:80px!important;height:86px!important;object-fit:cover!important;z-index:0!important}
    .sidebar>.side-promo div,.sidebar>.side-promo>i{position:relative!important;z-index:1!important}
    .sidebar>.side-promo b{font-size:12px!important;line-height:1.1!important}
    .sidebar>.side-promo small{font-size:10px!important;margin-top:7px!important}
    body.rwa-drawer-open{overflow:hidden!important}
  `;
  doc.head.appendChild(style);

  function setOpen(open){
    sidebar.dataset.drawerOpen=open?'true':'false';
    overlay.dataset.open=open?'true':'false';
    closeBtn.dataset.open=open?'true':'false';
    menu.setAttribute('aria-expanded',open?'true':'false');
    doc.body.classList.toggle('rwa-drawer-open',open);
  }
  menu.addEventListener('click',()=>setOpen(true));
  closeBtn.addEventListener('click',()=>setOpen(false));
  overlay.addEventListener('click',()=>setOpen(false));
  doc.addEventListener('keydown',e=>{if(e.key==='Escape')setOpen(false)});
  setOpen(false);
}
const S={
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',
 bars:'<path d="M4 20V12h4v8M10 20V7h4v13M16 20V3h4v17M2 20h20"/>',
 users:'<circle cx="12" cy="7" r="3"/><circle cx="5" cy="9" r="2.2"/><circle cx="19" cy="9" r="2.2"/><path d="M7 20v-3.3c0-2.5 2.2-4.5 5-4.5s5 2 5 4.5V20M1.8 19v-2.6c0-2 1.5-3.5 3.5-3.5 1 0 1.8.3 2.4.8M22.2 19v-2.6c0-2-1.5-3.5-3.5-3.5-1 0-1.8.3-2.4.8"/>',
 shield:'<path d="M12 2.5 20 5v6.2c0 5.2-3.2 8.5-8 10.3-4.8-1.8-8-5.1-8-10.3V5l8-2.5Z"/><path d="m8.5 11.8 2.2 2.2 4.8-5"/>',
 bag:'<path d="M5 8h14l1 13H4L5 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/>',
 building:'<path d="M4 21V8l8-4v17M12 21V6l8 3v12M2 21h20"/><path d="M7 11h2M7 14h2M7 17h2M15 11h2M15 14h2M15 17h2"/>',
 game:'<path d="M7 8h10a5 5 0 0 1 4.7 6.8l-1.1 2.8a2.6 2.6 0 0 1-4.2 1L14.8 17H9.2l-1.6 1.6a2.6 2.6 0 0 1-4.2-1l-1.1-2.8A5 5 0 0 1 7 8Z"/><path d="M7 11v4M5 13h4M16.5 12h.01M19 14h.01"/>',
 trend:'<path d="m3 17 6-6 4 4 8-9"/><path d="M15 6h6v6"/>',
 user:'<circle cx="12" cy="7" r="4"/><path d="M4 21c.7-5 3.5-7.5 8-7.5S19.3 16 20 21"/>'
};
function icon(name){return `<svg class="m-ref-icon" viewBox="0 0 24 24" aria-hidden="true">${S[name]}</svg>`}
function replaceNode(el,name){if(el)el.outerHTML=icon(name)}
function polishMobile(doc){
  const logo=doc.querySelector('.m-head img');if(logo)logo.src='assets/logo-ref-exact.png';
  replaceNode(doc.querySelector('.m-lang i:first-child'),'globe');
  ['globe','bars','users','shield'].forEach((n,i)=>replaceNode(doc.querySelectorAll('.m-usp>div>i')[i],n));
  ['bag','building','game'].forEach((n,i)=>replaceNode(doc.querySelectorAll('.m-verticals article>div>i')[i],n));
  ['trend','bars','users'].forEach((n,i)=>replaceNode(doc.querySelectorAll('.m-stats>div>i')[i],n));
  const nav=doc.querySelectorAll('.bottomnav button>i');
  replaceNode(nav[1],'bag');replaceNode(nav[2],'building');replaceNode(nav[3],'game');replaceNode(nav[4],'user');
}
desktopFrame.addEventListener('load',()=>{inject(desktopFrame,desktopCss);installDesktopDrawer(desktopFrame.contentDocument)});
mobileFrame.addEventListener('load',()=>{const doc=mobileFrame.contentDocument;if(!doc)return;polishMobile(doc)});
function viewportWidth(){return Math.round(window.visualViewport?.width||document.documentElement.clientWidth||window.innerWidth||0)}
function isMobileViewport(){if(forced==='mobile')return true;if(forced==='desktop')return false;const uaMobile=/Android|iPhone|iPod|Mobile|IEMobile|Opera Mini/i.test(navigator.userAgent)||navigator.userAgentData?.mobile===true;return viewportWidth()<=1199||(uaMobile&&viewportWidth()<1366)}
function fitDesktop(){
  if(isMobileViewport())return;
  const vw=Math.max(1024,viewportWidth());
  const scale=vw/1672;
  desktopStage.style.width='1672px';
  desktopStage.style.height='941px';
  desktopStage.style.margin='0';
  desktopStage.style.left='0';
  desktopStage.style.transform=`scale(${scale})`;
  desktopFrame.style.width='1672px';
  desktopFrame.style.height='941px';
  desktopWrap.style.width='100vw';
  desktopWrap.style.height=`${Math.ceil(941*scale)}px`;
}
function ensureFrame(frame){if(!frame.dataset.loaded){frame.dataset.loaded='1';frame.src=frame.dataset.src}}
function syncMode(){const mobile=isMobileViewport();document.documentElement.dataset.mode=mobile?'mobile':'desktop';ensureFrame(mobile?mobileFrame:desktopFrame);if(!mobile)fitDesktop()}
const mq=window.matchMedia('(max-width:1199px)');if(mq.addEventListener)mq.addEventListener('change',syncMode);else mq.addListener(syncMode);
window.addEventListener('resize',syncMode,{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(syncMode,50),{passive:true});
window.addEventListener('pageshow',syncMode,{passive:true});
window.visualViewport?.addEventListener('resize',syncMode,{passive:true});
syncMode();
</script>
</body>
</html>
