<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RWA.ms Responsive Preview</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#fff}
body{overflow:auto}
#stage{position:relative;transform-origin:top left;background:#fff}
#preview{display:block;border:0;background:#fff}
body.is-mobile{overflow:hidden}
body.is-mobile #stage{width:100%;height:100dvh;transform:none!important;margin:0!important}
body.is-mobile #preview{width:100%;height:100dvh}
body.is-desktop #preview{width:1672px;height:941px}
</style>
</head>
<body>
<div id="stage"><iframe id="preview" title="RWA.ms responsive real-code preview"></iframe></div>
<script>
const frame=document.getElementById('preview');
const stage=document.getElementById('stage');
const qs=new URLSearchParams(location.search);
const forced=qs.get('view');
const desktopCss=['desktop-finetune.css?v=091907a','desktop-pass.css?v=091907a','desktop-final.css?v=092105a'];
let mode='';
function wantsMobile(){
  if(forced==='mobile')return true;
  if(forced==='desktop')return false;
  return window.matchMedia('(max-width:1023px)').matches;
}
function fitDesktop(){
  if(mode!=='desktop')return;
  const scale=Math.min(1,window.innerWidth/1672);
  stage.style.width='1672px';
  stage.style.height='941px';
  stage.style.transform=`scale(${scale})`;
  stage.style.marginLeft=window.innerWidth>1672?`${(window.innerWidth-1672)/2}px`:'0px';
  document.body.style.height=`${Math.ceil(941*scale)}px`;
}
function applyMode(){
  const next=wantsMobile()?'mobile':'desktop';
  if(next===mode){if(next==='desktop')fitDesktop();return;}
  mode=next;
  document.body.className=next==='mobile'?'is-mobile':'is-desktop';
  document.body.style.height='';
  stage.style.cssText='';
  frame.title=next==='mobile'?'RWA.ms mobile real-code preview':'RWA.ms desktop real-code preview';
  frame.src=next==='mobile'?'mobile-code.html?responsive=1':'desktop.html?precision=1';
  if(next==='desktop')fitDesktop();
}
frame.addEventListener('load',()=>{
  if(mode!=='desktop')return;
  const doc=frame.contentDocument;
  if(!doc)return;
  for(const href of desktopCss){
    if(doc.querySelector(`link[data-preview-css="${href}"]`))continue;
    const link=doc.createElement('link');
    link.rel='stylesheet';
    link.href=href;
    link.dataset.previewCss=href;
    doc.head.appendChild(link);
  }
});
let resizeTimer;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(applyMode,80);
});
window.addEventListener('orientationchange',()=>setTimeout(applyMode,120));
applyMode();
</script>
</body>
</html>
