<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>RWA.ms Responsive Preview</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#fff}
body{overflow-x:hidden}
#desktopWrap{display:block;position:relative;width:100vw;overflow:hidden;background:#fff}
#desktopStage{position:absolute;left:0;top:0;width:1672px;height:941px;margin:0!important;transform-origin:top left;background:#fff}
#desktopFrame{display:block;border:0;width:1672px;height:941px;background:#fff}
#mobileWrap{display:none;width:100%;height:100dvh;overflow:hidden;background:#fff}
#mobileFrame{display:block;border:0;width:100%;height:100dvh;background:#fff}
@media (max-width:1023px){#desktopWrap{display:none!important}#mobileWrap{display:block!important}body{height:100dvh;overflow:hidden}}
@media (min-width:1024px){#desktopWrap{display:block!important}#mobileWrap{display:none!important}}
body[data-force="mobile"] #desktopWrap{display:none!important}
body[data-force="mobile"] #mobileWrap{display:block!important}
body[data-force="desktop"] #desktopWrap{display:block!important}
body[data-force="desktop"] #mobileWrap{display:none!important}
</style>
</head>
<body>
<div id="desktopWrap"><div id="desktopStage"><iframe id="desktopFrame" data-src="desktop.html?precision=6&sidebar=20260909h" title="RWA.ms desktop real-code preview"></iframe></div></div>
<div id="mobileWrap"><iframe id="mobileFrame" data-src="mobile-code.html?responsive=1" title="RWA.ms mobile real-code preview"></iframe></div>
<script>
const BUILD='20260909h';
try{const u=new URL(location.href);if(u.searchParams.get('build')!==BUILD){u.searchParams.set('build',BUILD);history.replaceState(null,'',u)}}catch(_e){}
const desktopFrame=document.getElementById('desktopFrame');
const mobileFrame=document.getElementById('mobileFrame');
const desktopStage=document.getElementById('desktopStage');
const desktopWrap=document.getElementById('desktopWrap');
const qs=new URLSearchParams(location.search);
const forced=qs.get('view');
if(forced==='mobile'||forced==='desktop')document.body.dataset.force=forced;
const desktopCss=['desktop-finetune.css?v=092209h','desktop-pass.css?v=092209h','desktop-final.css?v=092209h'];
let desktopBaseHeight=941;
let desktopResizeObserver=null;
function inject(frame,files){const doc=frame.contentDocument;if(!doc)return;for(const href of files){if(doc.querySelector(`link[data-preview-css="${href}"]`))continue;const link=doc.createElement('link');link.rel='stylesheet';link.href=href;link.dataset.previewCss=href;doc.head.appendChild(link)}}
function syncDesktopSidebar(doc){
  if(!doc)return;
  const sidebar=doc.querySelector('.sidebar');
  if(!sidebar)return;
  const promo=sidebar.querySelector(':scope > .side-promo');
  const learn=sidebar.querySelector('[data-action="open-learn-and-discover"]');
  if(promo&&learn&&learn.nextElementSibling!==promo)learn.after(promo);
  if(doc.querySelector('style[data-sidebar-sync="3"]'))return;
  const style=doc.createElement('style');
  style.dataset.sidebarSync='3';
  style.textContent=`
    .sidebar{display:flex!important;flex-direction:column!important;gap:5px!important;align-content:flex-start!important;justify-content:flex-start!important;height:auto!important;max-height:858px!important;overflow-y:auto!important;overscroll-behavior:contain!important;scrollbar-width:none!important;padding-bottom:8px!important}
    .sidebar::-webkit-scrollbar{display:none!important}
    .sidebar>.side-group,.sidebar>.side-simple,.sidebar>.side-promo{flex-shrink:0!important}
    .sidebar>.side-promo{position:static!important;margin:6px 0 0!important;flex:0 0 71px!important;height:71px!important}
    .sidebar>.side-simple{flex:0 0 27px!important}
    .sidebar>.side-group[data-accordion-group]{flex:0 0 auto!important;height:auto!important}
    .sidebar>.side-group[data-accordion-group][data-expanded="true"]{margin-bottom:1px!important}
  `;
  doc.head.appendChild(style);
}
function viewportWidth(){return Math.round(window.visualViewport?.width||document.documentElement.clientWidth||window.innerWidth||0)}
function isMobileViewport(){if(forced==='mobile')return true;if(forced==='desktop')return false;const uaMobile=/Android|iPhone|iPod|Mobile|IEMobile|Opera Mini/i.test(navigator.userAgent)||navigator.userAgentData?.mobile===true;return viewportWidth()<=1023||(uaMobile&&viewportWidth()<1366)}
function fitDesktop(){
  if(isMobileViewport())return;
  const vw=Math.max(1024,viewportWidth());
  const scale=vw/1672;
  desktopStage.style.width='1672px';
  desktopStage.style.height=`${desktopBaseHeight}px`;
  desktopStage.style.margin='0';
  desktopStage.style.left='0';
  desktopStage.style.transform=`scale(${scale})`;
  desktopFrame.style.width='1672px';
  desktopFrame.style.height=`${desktopBaseHeight}px`;
  desktopWrap.style.width='100vw';
  desktopWrap.style.height=`${Math.ceil(desktopBaseHeight*scale)}px`;
}
function measureDesktopHeight(){
  if(isMobileViewport())return;
  const doc=desktopFrame.contentDocument;
  if(!doc)return;
  const content=doc.querySelector('.content');
  const sidebar=doc.querySelector('.sidebar');
  const topbar=doc.querySelector('.topbar');
  const bottoms=[content,sidebar,topbar].filter(Boolean).map(el=>el.getBoundingClientRect().bottom);
  const measured=bottoms.length?Math.max(...bottoms)+8:941;
  desktopBaseHeight=Math.max(930,Math.ceil(measured));
  fitDesktop();
}
function installDesktopMeasurement(doc){
  if(!doc)return;
  if(desktopResizeObserver){desktopResizeObserver.disconnect();desktopResizeObserver=null}
  if('ResizeObserver' in window){
    desktopResizeObserver=new ResizeObserver(()=>requestAnimationFrame(measureDesktopHeight));
    [doc.querySelector('.content'),doc.querySelector('.sidebar')].filter(Boolean).forEach(el=>desktopResizeObserver.observe(el));
  }
  doc.querySelectorAll('.sidebar>.side-group[data-accordion-group]>.side-title').forEach(btn=>btn.addEventListener('click',()=>requestAnimationFrame(()=>requestAnimationFrame(measureDesktopHeight)),true));
  requestAnimationFrame(()=>requestAnimationFrame(measureDesktopHeight));
}
const S={
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',
 bars:'<path d="M4 20V12h4v8M10 20V7h4v13M16 20V3h4v17M2 20h20"/>',
 users:'<circle cx="12" cy="7" r="3"/><circle cx="5" cy="9" r="2.2"/><circle cx="19" cy="9" r="2.2"/><path d="M7 20v-3.3c0-2.5 2.2-4.5 5-4.5s5 2 5 4.5V20M1.8 19v-2.6c0-2 1.5-3.5 3.5-3.5 1 0 1.8.3 2.4.8M22.2 19v-2.6c0-2-1.5-3.5-3.5-3.5-1 0-1.8.3-2.4.8"/>',
 shield:'<path d="M12 2.5 20 5v6.2c0 5.2-3.2 8.5-8 10.3-4.8-1.8-8-5.1-8-10.3V5l8-2.5Z"/><path d="m8.5 11.8 2.2 2.2 4.8-5"/>',
 bag:'<path d="M5 8h14l1 13H4L5 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/>',
 building:'<path d="M4 21V8l8-4v17M12 21V6l8 3v12M2 21h20"/><path d="M7 11h2M7 14h2M7 17h2M15 11h2M15 14h2M15 17h2"/>',
 game:'<path d="M7 8h10a5 5 0 0 1 4.7 6.8l-1.1 2.8a2.6 2.6 0 0 1-4.2 1L14.8 17H9.2l-1.6 1.6a2.6 2.6 0 0 1-4.2-1l-1.1-2.8A5 5 0 0 1 7 8Z"/><path d="M7 11v4M5 13h4M16.5 12h.01M19 14h.01"/>',
 trend:'<path d="m3 17 6-6 4 4 8-9"/><path d="M15 6h6v6"/>',
 user:'<circle cx="12" cy="7" r="4"/><path d="M4 21c.7-5 3.5-7.5 8-7.5S19.3 16 20 21"/>'
};
function icon(name){return `<svg class="m-ref-icon" viewBox="0 0 24 24" aria-hidden="true">${S[name]}</svg>`}
function replaceNode(el,name){if(el)el.outerHTML=icon(name)}
function polishMobile(doc){
  const logo=doc.querySelector('.m-head img');if(logo)logo.src='assets/logo-ref-exact.png';
  replaceNode(doc.querySelector('.m-lang i:first-child'),'globe');
  ['globe','bars','users','shield'].forEach((n,i)=>replaceNode(doc.querySelectorAll('.m-usp>div>i')[i],n));
  ['bag','building','game'].forEach((n,i)=>replaceNode(doc.querySelectorAll('.m-verticals article>div>i')[i],n));
  ['trend','bars','users'].forEach((n,i)=>replaceNode(doc.querySelectorAll('.m-stats>div>i')[i],n));
  const nav=doc.querySelectorAll('.bottomnav button>i');
  replaceNode(nav[1],'bag');replaceNode(nav[2],'building');replaceNode(nav[3],'game');replaceNode(nav[4],'user');
}
desktopFrame.addEventListener('load',()=>{inject(desktopFrame,desktopCss);const doc=desktopFrame.contentDocument;syncDesktopSidebar(doc);installDesktopMeasurement(doc)});
mobileFrame.addEventListener('load',()=>{const doc=mobileFrame.contentDocument;if(!doc)return;polishMobile(doc)});
function ensureFrame(frame){if(!frame.dataset.loaded){frame.dataset.loaded='1';frame.src=frame.dataset.src}}
function syncMode(){const mobile=isMobileViewport();document.documentElement.dataset.mode=mobile?'mobile':'desktop';ensureFrame(mobile?mobileFrame:desktopFrame);if(!mobile){fitDesktop();requestAnimationFrame(measureDesktopHeight)}}
const mq=window.matchMedia('(max-width:1023px)');if(mq.addEventListener)mq.addEventListener('change',syncMode);else mq.addListener(syncMode);
window.addEventListener('resize',syncMode,{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(syncMode,50),{passive:true});
window.addEventListener('pageshow',syncMode,{passive:true});
window.addEventListener('load',syncMode,{passive:true});
window.visualViewport?.addEventListener('resize',syncMode,{passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncMode()},{passive:true});
syncMode();
</script>
</body>
</html>
