<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RWA.ms Responsive Preview</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#fff}
body{overflow-x:hidden}
#desktopWrap{display:block;width:100%;overflow:hidden;background:#fff}
#desktopStage{width:1672px;height:941px;transform-origin:top left;background:#fff}
#desktopFrame{display:block;border:0;width:1672px;height:941px;background:#fff}
#mobileWrap{display:none;width:100%;height:100dvh;overflow:hidden;background:#fff}
#mobileFrame{display:block;border:0;width:100%;height:100dvh;background:#fff}
@media (max-width:1023px){#desktopWrap{display:none!important}#mobileWrap{display:block!important}body{height:100dvh;overflow:hidden}}
@media (min-width:1024px){#desktopWrap{display:block!important}#mobileWrap{display:none!important}}
body[data-force="mobile"] #desktopWrap{display:none!important}
body[data-force="mobile"] #mobileWrap{display:block!important}
body[data-force="desktop"] #desktopWrap{display:block!important}
body[data-force="desktop"] #mobileWrap{display:none!important}
</style>
</head>
<body>
<div id="desktopWrap"><div id="desktopStage"><iframe id="desktopFrame" data-src="desktop.html?precision=2&sidebar=20260909c" title="RWA.ms desktop real-code preview"></iframe></div></div>
<div id="mobileWrap"><iframe id="mobileFrame" data-src="mobile-code.html?responsive=1" title="RWA.ms mobile real-code preview"></iframe></div>
<script>
const desktopFrame=document.getElementById('desktopFrame');
const mobileFrame=document.getElementById('mobileFrame');
const desktopStage=document.getElementById('desktopStage');
const desktopWrap=document.getElementById('desktopWrap');
const qs=new URLSearchParams(location.search);
const forced=qs.get('view');
if(forced==='mobile'||forced==='desktop')document.body.dataset.force=forced;
const desktopCss=['desktop-finetune.css?v=092209b','desktop-pass.css?v=092209b','desktop-final.css?v=092209b'];
const mobileCss=[];
function inject(frame,files){const doc=frame.contentDocument;if(!doc)return;for(const href of files){if(doc.querySelector(`link[data-preview-css="${href}"]`))continue;const link=doc.createElement('link');link.rel='stylesheet';link.href=href;link.dataset.previewCss=href;doc.head.appendChild(link)}}
const S={
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',
 bars:'<path d="M4 20V12h4v8M10 20V7h4v13M16 20V3h4v17M2 20h20"/>',
 users:'<circle cx="12" cy="7" r="3"/><circle cx="5" cy="9" r="2.2"/><circle cx="19" cy="9" r="2.2"/><path d="M7 20v-3.3c0-2.5 2.2-4.5 5-4.5s5 2 5 4.5V20M1.8 19v-2.6c0-2 1.5-3.5 3.5-3.5 1 0 1.8.3 2.4.8M22.2 19v-2.6c0-2-1.5-3.5-3.5-3.5-1 0-1.8.3-2.4.8"/>',
 shield:'<path d="M12 2.5 20 5v6.2c0 5.2-3.2 8.5-8 10.3-4.8-1.8-8-5.1-8-10.3V5l8-2.5Z"/><path d="m8.5 11.8 2.2 2.2 4.8-5"/>',
 bag:'<path d="M5 8h14l1 13H4L5 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/>',
 building:'<path d="M4 21V8l8-4v17M12 21V6l8 3v12M2 21h20"/><path d="M7 11h2M7 14h2M7 17h2M15 11h2M15 14h2M15 17h2"/>',
 game:'<path d="M7 8h10a5 5 0 0 1 4.7 6.8l-1.1 2.8a2.6 2.6 0 0 1-4.2 1L14.8 17H9.2l-1.6 1.6a2.6 2.6 0 0 1-4.2-1l-1.1-2.8A5 5 0 0 1 7 8Z"/><path d="M7 11v4M5 13h4M16.5 12h.01M19 14h.01"/>',
 trend:'<path d="m3 17 6-6 4 4 8-9"/><path d="M15 6h6v6"/>',
 user:'<circle cx="12" cy="7" r="4"/><path d="M4 21c.7-5 3.5-7.5 8-7.5S19.3 16 20 21"/>'
};
function icon(name){return `<svg class="m-ref-icon" viewBox="0 0 24 24" aria-hidden="true">${S[name]}</svg>`}
function replaceNode(el,name){if(el)el.outerHTML=icon(name)}
function slug(s){return s.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function polishDesktop(doc){
  const sidebar=doc.querySelector('.sidebar');
  if(!sidebar||sidebar.dataset.canonicalSidebar==='1')return;
  sidebar.dataset.canonicalSidebar='1';
  const before=sidebar.querySelector('[data-action="open-verified-assets"]');
  if(!before)return;

  sidebar.querySelectorAll(':scope > .side-group').forEach(el=>el.remove());

  const groups=[
    {key:'marketplace',label:'Marketplace',icon:'fa-bag-shopping',open:true,items:["Women's Clothing",'Shoes',"Men's Clothing",'Bags & Luggage','Beauty & Health']},
    {key:'property',label:'Property',icon:'fa-building',open:false,items:['TownHouse','Rumah Sakit','Apartment & Condominium','Villa & Resort','Hotel','Office Tower','Kawasan Industri','Mixed Use Development']},
    {key:'games',label:'Games',icon:'fa-gamepad',open:false,items:['Game Land','Characters','Weapons','Skins','Loot Boxes','Game Tokens','Esports Assets','Metaverse Assets']},
    {key:'ai-models',label:'AI Models',icon:'fa-brain',open:false,items:['Trading','Finance','Medical','Legal','Property','Agriculture','Manufacturing','Logistics','Automotive','Energy','Construction','Retail','Education','Insurance','Security','Research']},
    {key:'franchise',label:'Franchise',icon:'fa-store',open:false,items:['Food & Beverage','Coffee & Cafe','Education','Fitness','Services','Petcare']},
    {key:'apps',label:'Apps',icon:'fa-table-cells-large',open:false,items:['Business','Finance','Social','Media','Health','Education','Travel','Food']}
  ];

  function setExpanded(section,expanded){
    section.dataset.expanded=expanded?'true':'false';
    const btn=section.querySelector('.side-title');
    btn.setAttribute('aria-expanded',expanded?'true':'false');
    const chev=btn.querySelector('.rwa-chevron');
    if(chev)chev.className=`rwa-chevron fa-solid ${expanded?'fa-chevron-up':'fa-chevron-down'}`;
  }

  for(const group of groups){
    const section=doc.createElement('section');
    section.className='side-group side-group-canonical';
    section.dataset.rwaGroup=group.key;
    const links=group.items.map(item=>`<a data-action="filter-${group.key}-${slug(item)}" href="#"><i class="fa-solid fa-angle-right" aria-hidden="true"></i>${item}</a>`).join('');
    section.innerHTML=`<button aria-expanded="${group.open?'true':'false'}" class="side-title" type="button"><span><i class="fa-solid ${group.icon}" aria-hidden="true"></i>${group.label}</span><i class="rwa-chevron fa-solid ${group.open?'fa-chevron-up':'fa-chevron-down'}"></i></button>${links}`;
    setExpanded(section,group.open);
    const title=section.querySelector('.side-title');
    title.addEventListener('click',e=>{
      e.preventDefault();
      e.stopImmediatePropagation();
      const shouldOpen=section.dataset.expanded!=='true';
      if(shouldOpen){
        sidebar.querySelectorAll(':scope > .side-group.side-group-canonical').forEach(other=>{
          if(other!==section)setExpanded(other,false);
        });
      }
      setExpanded(section,shouldOpen);
    },true);
    section.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>e.preventDefault()));
    before.before(section);
  }

  const style=doc.createElement('style');
  style.dataset.previewSidebarCanonical='1';
  style.textContent=`
    .sidebar{overflow-y:auto!important;overscroll-behavior:contain!important;scrollbar-width:none!important;padding-bottom:6px!important;scroll-behavior:smooth!important}
    .sidebar::-webkit-scrollbar{display:none!important}
    .sidebar>.side-group,.sidebar>.side-simple,.sidebar>.side-promo{flex-shrink:0!important}
    .sidebar>.side-group.side-group-canonical{height:auto!important;min-height:41px!important;overflow:hidden!important;border-radius:8px!important}
    .sidebar>.side-group.side-group-canonical .side-title{height:41px!important;min-height:41px!important}
    .sidebar>.side-group.side-group-canonical[data-expanded="false"]>a{display:none!important}
    .sidebar>.side-group.side-group-canonical[data-expanded="true"]>a{display:flex!important}
    .sidebar>.side-group.side-group-canonical>a{height:25px!important;min-height:25px!important;padding:0 14px!important;gap:11px!important;font-size:12.5px!important;white-space:nowrap!important}
    .sidebar>.side-group.side-group-canonical .side-title span>i:first-child{font-size:17px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;width:19px!important;height:19px!important;flex:0 0 19px!important;background:none!important;-webkit-mask:none!important;mask:none!important;color:#071733!important}
    .sidebar>.side-group.side-group-canonical>a i{font-size:9px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;width:14px!important;height:14px!important;flex:0 0 14px!important;background:none!important;-webkit-mask:none!important;mask:none!important;color:#0a5f56!important}
    .sidebar>.side-group.side-group-canonical .rwa-chevron{font-size:10px!important;background:none!important;-webkit-mask:none!important;mask:none!important;color:#071733!important;width:auto!important;height:auto!important}
  `;
  doc.head.appendChild(style);
}
function polishMobile(doc){
  const logo=doc.querySelector('.m-head img');if(logo)logo.src='assets/logo-ref-exact.png';
  replaceNode(doc.querySelector('.m-lang i:first-child'),'globe');
  ['globe','bars','users','shield'].forEach((n,i)=>replaceNode(doc.querySelectorAll('.m-usp>div>i')[i],n));
  ['bag','building','game'].forEach((n,i)=>replaceNode(doc.querySelectorAll('.m-verticals article>div>i')[i],n));
  ['trend','bars','users'].forEach((n,i)=>replaceNode(doc.querySelectorAll('.m-stats>div>i')[i],n));
  const nav=doc.querySelectorAll('.bottomnav button>i');
  replaceNode(nav[1],'bag');replaceNode(nav[2],'building');replaceNode(nav[3],'game');replaceNode(nav[4],'user');
}
desktopFrame.addEventListener('load',()=>{inject(desktopFrame,desktopCss);const doc=desktopFrame.contentDocument;if(doc)polishDesktop(doc)});
mobileFrame.addEventListener('load',()=>{const doc=mobileFrame.contentDocument;if(!doc)return;polishMobile(doc)});
function viewportWidth(){return Math.round(window.visualViewport?.width||document.documentElement.clientWidth||window.innerWidth||0)}
function viewportHeight(){return Math.round(window.visualViewport?.height||document.documentElement.clientHeight||window.innerHeight||0)}
function isMobileViewport(){if(forced==='mobile')return true;if(forced==='desktop')return false;const uaMobile=/Android|iPhone|iPod|Mobile|IEMobile|Opera Mini/i.test(navigator.userAgent)||navigator.userAgentData?.mobile===true;return viewportWidth()<=1023||(uaMobile&&viewportWidth()<1366)}
function fitDesktop(){
  if(isMobileViewport())return;
  const vw=viewportWidth();
  const vh=viewportHeight();
  const widthScale=vw/1672;
  const heightScale=Math.max(.72,(vh-8)/941);
  const scale=Math.min(1.35,widthScale,heightScale);
  const renderedWidth=1672*scale;
  desktopStage.style.transform=`scale(${scale})`;
  desktopStage.style.marginLeft=`${Math.max(0,(vw-renderedWidth)/2)}px`;
  desktopWrap.style.height=`${Math.ceil(941*scale)}px`;
}
function ensureFrame(frame){if(!frame.dataset.loaded){frame.dataset.loaded='1';frame.src=frame.dataset.src}}
function syncMode(){const mobile=isMobileViewport();document.documentElement.dataset.mode=mobile?'mobile':'desktop';ensureFrame(mobile?mobileFrame:desktopFrame);if(!mobile)fitDesktop()}
const mq=window.matchMedia('(max-width:1023px)');if(mq.addEventListener)mq.addEventListener('change',syncMode);else mq.addListener(syncMode);
window.addEventListener('resize',syncMode,{passive:true});window.addEventListener('orientationchange',()=>setTimeout(syncMode,50),{passive:true});window.visualViewport?.addEventListener('resize',syncMode,{passive:true});syncMode();
</script>
</body>
</html>
