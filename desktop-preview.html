<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RWA.ms Desktop Precision Preview</title>
<style>
html,body{margin:0;background:#fff;width:100%;height:100%;overflow:auto}
iframe{display:block;border:0;width:1672px;height:941px;background:#fff}
</style>
</head>
<body>
<iframe id="preview" src="desktop.html?precision=1" title="RWA.ms desktop real-code preview"></iframe>
<script>
const frame=document.getElementById('preview');
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  if(!doc)return;
  const link=doc.createElement('link');
  link.rel='stylesheet';
  link.href='desktop-finetune.css?v=091812a3';
  doc.head.appendChild(link);
});
</script>
</body>
</html>
